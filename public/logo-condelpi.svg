<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <!-- Mask to create the transparent "C" cut-out inside the main circle -->
    <mask id="condelpi-c-mask">
      <!-- Everything white remains visible -->
      <rect x="0" y="0" width="200" height="60" fill="#ffffff" />
      <!-- The black path cuts a hole with rounded ends -->
      <path d="M 38.4 22.9 A 11 11 0 1 0 38.4 37.1" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" />
    </mask>
    <style>
      .brand-circle { fill: var(--primary-color, #152A55); }
      .brand-accent { fill: var(--secondary-color, #E2A31B); }
      .brand-text { fill: var(--text-main, #0F172A); font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.5px; }
      /* Dark mode override for login banner */
      @media (prefers-color-scheme: dark) {
        .brand-circle { fill: #ffffff; }
        .brand-text { fill: #ffffff; }
      }
    </style>
  </defs>

  <g transform="translate(5, 0)">
    <!-- Yellow Ribbon Fold (rendered behind the main circle) -->
    <path class="brand-accent" d="M 16 38 C 16 48 24 56 34 54 C 40 52 42 46 36 38 Z" />
    
    <!-- Main Circle with "C" Mask Applied -->
    <circle class="brand-circle" cx="30" cy="30" r="22" mask="url(#condelpi-c-mask)" />
  </g>
  
  <!-- Text -->
  <text x="68" y="39" class="brand-text">condelpi</text>
</svg>
