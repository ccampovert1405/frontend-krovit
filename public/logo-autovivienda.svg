<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>
  <!-- Icono combinando Casa y Rueda -->
  <g transform="translate(10, 5)">
    <!-- Circulo exterior (Rueda) con aberturas -->
    <circle cx="25" cy="25" r="22" fill="none" stroke="url(#logoGrad)" stroke-width="4.5" stroke-dasharray="14 4" />
    <circle cx="25" cy="25" r="14" fill="none" stroke="#0D9488" stroke-width="2" />
    
    <!-- Techo de Casa centrado -->
    <path d="M12 28 L25 15 L38 28" fill="none" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Paredes de Casa -->
    <path d="M16 27 L16 38 L34 38 L34 27" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Puerta -->
    <path d="M22 38 L22 31 L28 31 L28 38" fill="url(#logoGrad)" />
  </g>
  
  <!-- Texto de Marca -->
  <text x="70" y="32" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="900" font-size="22" fill="#0F172A" letter-spacing="-0.5px">Auto<tspan fill="#0D9488">Vivienda</tspan></text>
  <text x="70" y="47" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="600" font-size="10" fill="#475569" letter-spacing="1px">SISTEMA CRM</text>
</svg>
